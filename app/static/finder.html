<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>근처 동물병원 지도</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="/static/finder.css" />
</head>
<body class="embed">
  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-head">
        <h1>근처 병원</h1>
        <p class="loc-status" id="loc-status">위치를 확인하세요</p>
      </div>

      <div class="toolbar">
        <button type="button" class="btn primary" id="btn-geo">내 위치 (GPS)</button>
        <div class="chip-row" id="city-chips"></div>
      </div>

      <div class="filter-block">
        <p class="filter-label">병원 등급</p>
        <div class="chip-row" id="care-chips"></div>
      </div>

      <div class="filter-block">
        <p class="filter-label">빠른 필터</p>
        <div class="chip-row">
          <button type="button" class="chip toggle" id="btn-24h" aria-pressed="false">24시</button>
          <button type="button" class="chip toggle hot" id="btn-er" aria-pressed="false">응급·수술</button>
        </div>
      </div>

      <div class="filter-block">
        <p class="filter-label">아픈 부위 (선택)</p>
        <div class="chip-row wrap" id="symptom-chips"></div>
      </div>

      <div class="radius-row">
        <label for="radius">반경 <span id="radius-label">8</span>km</label>
        <input type="range" id="radius" min="3" max="25" step="1" value="8" />
      </div>

      <section class="featured" id="featured-wrap" hidden>
        <h2>24시 · 응급 우선</h2>
        <div id="featured-list"></div>
      </section>

      <section class="list-wrap">
        <h2>그 외 병원 <span id="count-label"></span></h2>
        <div id="results-list" class="results-list"></div>
      </section>
    </aside>

    <div class="map-pane">
      <div id="map" role="application" aria-label="병원 지도"></div>
      <div class="map-hint" id="map-hint">지도를 클릭해 기준 위치를 옮길 수 있어요</div>
    </div>
  </div>

  <script src="/static/vendor/leaflet/leaflet.js"></script>
  <script src="/static/finder.js" defer></script>
</body>
</html>
